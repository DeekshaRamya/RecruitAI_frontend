<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Recruiter primary gradient (Blue -> Cyan) -->
    <linearGradient id="logoGradRecruiter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Candidate primary gradient (Purple -> Pink) -->
    <linearGradient id="logoGradCandidate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- General gradient used for the icon -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- SVG Icon: Hexagonal AI Node + R Symbol -->
  <g transform="translate(10, 10)">
    <!-- Outer hexagonal glowing outline -->
    <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="none" stroke="url(#iconGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.4" />
    
    <!-- Inner hexagonal shape -->
    <polygon points="50,12 83,31 83,69 50,88 17,69 17,31" fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Connecting AI Node dots -->
    <circle cx="50" cy="5" r="4" fill="#06b6d4" />
    <circle cx="90" cy="28" r="4" fill="#2563eb" />
    <circle cx="90" cy="72" r="4" fill="#7c3aed" />
    <circle cx="50" cy="95" r="4" fill="#ec4899" />
    <circle cx="10" cy="72" r="4" fill="#7c3aed" />
    <circle cx="10" cy="28" r="4" fill="#2563eb" />

    <!-- Stylized 'R' inside the hex -->
    <path d="M 38,30 L 58,30 C 65,30 68,34 68,39 C 68,44 64,48 58,48 L 38,48 Z" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 38,48 L 38,70" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 52,48 L 66,70" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Pulse core center node -->
    <circle cx="50" cy="50" r="3" fill="currentColor" />
  </g>

  <!-- Text Logo (Uses currentColor to automatically adapt to light/dark recruiter/candidate themes) -->
  <text x="130" y="70" font-family="'Outfit', 'Inter', sans-serif" font-size="44" font-weight="800" fill="currentColor" letter-spacing="-1">
    Recruit<tspan fill="url(#iconGrad)">AI</tspan>
  </text>
  
  <text x="132" y="92" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="500" fill="currentColor" opacity="0.55" letter-spacing="4">
    ASSESSMENT PLATFORM
  </text>
</svg>
